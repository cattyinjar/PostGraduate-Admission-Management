[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "postgraduate-admission-monitor"
version = "0.1.0"
description = "Personal desktop monitor for postgraduate admission announcements"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "PySide6-Essentials>=6.6",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "trafilatura>=1.8",
  "keyring>=24.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-timeout>=2.2",
  "ruff>=0.6",
  "mypy>=1.10"
]

[project.scripts]
pgam = "pgam.desktop.app:main"

[tool.setuptools.packages.find]
include = ["pgam*"]

[tool.pytest.ini_options]
testpaths = ["pgam/tests"]
addopts = "-q"
timeout = 30

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
